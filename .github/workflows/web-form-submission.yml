name: Web Form Submission Handler

# Trigger: Form data posted to this workflow
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - submit
          - confirm
      formData:
        description: 'Form data as JSON'
        required: true
        type: string
      token:
        description: 'Confirmation token (for confirm action)'
        required: false
        type: string

permissions:
  issues: write
  contents: read

jobs:
  submit-venue:
    if: github.event.inputs.action == 'submit'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Parse form data
        id: parse
        run: |
          echo "${{ github.event.inputs.formData }}" > /tmp/form.json
          cat /tmp/form.json

      - name: Create GitHub Issue for submission
        id: create-issue
        uses: actions/github-script@v7
        with:
          script: |
            const formData = ${{ github.event.inputs.formData }};
            const { name, address, neighborhood, category, indoor, amenities, hours, email } = formData;

            const issueTitle = '[WEB-FORM] ' + name + ' - ' + email;
            const amenitiesList = amenities.length > 0 ? amenities.join(', ') : '(none)';
            const issueBody = '## Venue Submission via Web Form\n\n' +
              '**Submitted:** ' + new Date().toISOString() + '\n' +
              '**Email:** ' + email + '\n\n' +
              '### Location Details\n' +
              '- **Name:** ' + name + '\n' +
              '- **Address:** ' + address + '\n' +
              '- **Neighborhood:** ' + (neighborhood || '(not provided)') + '\n' +
              '- **Category:** ' + category + '\n' +
              '- **Indoor/Outdoor:** ' + (indoor ? 'Indoor' : 'Outdoor') + '\n' +
              '- **Amenities:** ' + amenitiesList + '\n' +
              '- **Hours:** ' + (hours || '(not provided)') + '\n\n' +
              '### Status\n' +
              '- [ ] Email Confirmed\n' +
              '- [ ] Verified by Moderator\n' +
              '- [ ] Published to Map\n\n' +
              '---\n' +
              '*This issue tracks the community submission. User will receive email confirmation link.*';

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['community-submission', 'web-form', 'pending-confirmation']
            });

            console.log(`Created issue #${issue.number}`);
            core.setOutput('issueNumber', issue.number);
            return issue.number;

      - name: Generate confirmation token
        id: token
        run: |
          node -e "
            const jwt = require('jsonwebtoken');
            const token = jwt.sign(
              {
                email: '${{ fromJSON(github.event.inputs.formData).email }}',
                issueNumber: ${{ steps.create-issue.outputs.issueNumber }},
                venueId: 'sub/' + Date.now()
              },
              '${{ secrets.JWT_SECRET }}',
              { expiresIn: '7d' }
            );
            console.log('TOKEN=' + token);
          " >> $GITHUB_OUTPUT

      - name: Send confirmation email
        run: |
          node -e "
            const { Resend } = require('resend');
            const resend = new Resend('${{ secrets.RESEND_API_KEY }}');
            const formData = ${{ github.event.inputs.formData }};
            const confirmUrl = 'https://plug.vln.gg/confirm?token=${{ steps.token.outputs.TOKEN }}';
            
            const neighborhoodHtml = formData.neighborhood ? '🏘️ ' + formData.neighborhood + '<br>' : '';
            const hoursHtml = formData.hours ? '⏰ ' + formData.hours + '<br>' : '';
            const amenitiesHtml = formData.amenities.length > 0 ? '✨ ' + formData.amenities.join(', ') + '<br>' : '';

            const html = '<!DOCTYPE html>' +
              '<html>' +
              '<head>' +
              '<meta charset="utf-8">' +
              '<style>' +
              'body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }' +
              '.container { max-width: 600px; margin: 0 auto; padding: 20px; }' +
              '.header { background: #3b82f6; color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }' +
              '.venue { background: #f3f4f6; padding: 15px; border-radius: 6px; margin: 15px 0; }' +
              '.button { background: #3b82f6; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; display: inline-block; margin-top: 20px; }' +
              '</style>' +
              '</head>' +
              '<body>' +
              '<div class="container">' +
              '<div class="header">' +
              '<h1>Confirm Your Charging Location</h1>' +
              '</div>' +
              '<p>Thanks for suggesting <strong>' + formData.name + '</strong>!</p>' +
              '<div class="venue">' +
              '<strong>' + formData.name + '</strong><br>' +
              '📍 ' + formData.address + '<br>' +
              neighborhoodHtml +
              hoursHtml +
              amenitiesHtml +
              '</div>' +
              '<a href="' + confirmUrl + '" class="button">Confirm Submission</a>' +
              '<p>This link expires in 7 days.</p>' +
              '</div>' +
              '</body>' +
              '</html>';

            resend.emails.send({
              from: 'confirm@queen.vln.gg',
              to: formData.email,
              subject: 'Confirm: ' + formData.name + ' Charging Location',
              html: html
            });
          "

  confirm-submission:
    if: github.event.inputs.action == 'confirm'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify and decode token
        id: verify
        run: |
          node -e "
            const jwt = require('jsonwebtoken');
            try {
              const decoded = jwt.verify('${{ github.event.inputs.token }}', '${{ secrets.JWT_SECRET }}');
              console.log('EMAIL=' + decoded.email);
              console.log('ISSUE=' + decoded.issueNumber);
              console.log('VALID=true');
            } catch (e) {
              console.error('Invalid token:', e.message);
              process.exit(1);
            }
          " >> $GITHUB_OUTPUT

      - name: Update GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ steps.verify.outputs.ISSUE }}');
            
            // Get current issue
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            // Check if already confirmed
            if (issue.labels.some(label => label.name === 'email-confirmed')) {
              console.log('Issue already confirmed');
              return;
            }

            // Update labels
            const newLabels = issue.labels
              .map(label => label.name)
              .filter(name => name !== 'pending-confirmation')
              .concat('email-confirmed');

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: newLabels
            });

            // Add confirmation comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: '✅ **Email confirmed** by ' + '${{ steps.verify.outputs.EMAIL }}' + ' on ' + new Date().toISOString() + '\n\nThis submission is now ready for moderator review and publication.'
            });

      - name: Send thank you email
        run: |
          node -e "
            const { Resend } = require('resend');
            const resend = new Resend('${{ secrets.RESEND_API_KEY }}');

            const html = '<!DOCTYPE html>' +
              '<html>' +
              '<head>' +
              '<meta charset=\"utf-8\">' +
              '<style>' +
              'body { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif; }' +
              '.container { max-width: 600px; margin: 0 auto; padding: 20px; }' +
              '.header { background: #059669; color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }' +
              '.timeline { background: #f0fdf4; padding: 15px; border-radius: 6px; margin: 15px 0; }' +
              '.step { margin: 10px 0; }' +
              '.button { background: #3b82f6; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; display: inline-block; margin-top: 20px; }' +
              '</style>' +
              '</head>' +
              '<body>' +
              '<div class=\"container\">' +
              '<div class=\"header\">' +
              '<h1>✅ Email Confirmed!</h1>' +
              '</div>' +
              '<p>Thanks for confirming your charging location submission! Here\\'s what happens next:</p>' +
              '<div class=\"timeline\">' +
              '<div class=\"step\">✅ <strong>Email confirmed</strong> - Just now</div>' +
              '<div class=\"step\">🔍 <strong>Moderator review</strong> - 1-2 business days</div>' +
              '<div class=\"step\">📍 <strong>Published to map</strong> - Within 48 hours</div>' +
              '<div class=\"step\">📧 <strong>You\\'ll get another email</strong> when it goes live</div>' +
              '</div>' +
              '<p>Thank you for helping people find free charging!</p>' +
              '<a href=\"https://plug.vln.gg\" class=\"button\">View the Map</a>' +
              '</div>' +
              '</body>' +
              '</html>';

            resend.emails.send({
              from: 'info@queen.vln.gg',
              to: '${{ steps.verify.outputs.EMAIL }}',
              subject: '✅ Your Charging Location is Ready for Review',
              html: html
            });
          "
