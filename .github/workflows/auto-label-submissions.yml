name: Auto-label location submissions

# Automatically label issues created via the location form template.
# Provides redundancy in case the template's built-in labels don't apply
# (which can happen due to GitHub timing issues).
#
# Triggers on any new issue and checks if it contains location form fields.
# If it matches the location form structure, applies the 'submission' label.

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  auto-label:
    runs-on: ubuntu-latest
    steps:
      - name: Check if issue is a location submission form
        id: check
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # Check if the issue body contains location form fields
          if echo "$ISSUE_BODY" | grep -q "### Place name"; then
            echo "is_submission=true" >> $GITHUB_OUTPUT
          else
            echo "is_submission=false" >> $GITHUB_OUTPUT
          fi

      - name: Apply submission label if needed
        if: steps.check.outputs.is_submission == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const labels = (context.payload.issue.labels || []).map(l => l.name);

            // Check if already labeled
            if (labels.includes('submission')) {
              console.log('Issue already has submission label');
              return;
            }

            // Add the submission label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['submission']
            });

            console.log('Applied submission label to issue #' + context.issue.number);
