name: Deploy to GitHub Pages

# Gates (audit, security/CSP tests, build) run locally via Docker:
#   npm run gate
# so pull requests spend no Actions minutes. This workflow only runs on
# pushes to main, re-running the same Dockerfile gates before deploying.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Gate, build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Gate and build site (Dockerfile)
        run: docker build --target site --output type=local,dest=dist .

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
